name: Menu TV quotidien

on:
  schedule:
    # DEUX horaires, plus trois. GitHub met les taches planifiees dans une file
    # commune : une execution manquee DISPARAIT sans rattrapage, donc un cron
    # unique reste un pari. Mais le journal a montre que le troisieme tir du
    # matin se faisait systematiquement fermer la porte par YouTube (404 en
    # serie), et qu'il abimait la reputation de l'adresse pour le lendemain.
    #
    # Deux tirs espaces de deux heures passaient, eux, sans incident. Et le
    # stock de videos couvre desormais une journee entierement manquee : la
    # redondance n'a plus a etre une assurance tous risques.
    #
    # Heures UTC, decalees de l'heure pile (la minute 0 est celle que tout le
    # monde choisit, donc la plus encombree). Tout est boucle avant 8h30 Paris.
    - cron: "13 1 * * *"    # 03h13 Paris en heure d'ete (02h13 en hiver)
    - cron: "41 3 * * *"    # 05h41 Paris (04h41 en hiver)
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: menu-tv
  cancel-in-progress: false

jobs:
  construire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests pyyaml
      - name: Generer la grille
        env:
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
        run: python menu_tv.py
      - name: Memoriser ce qui a ete propose
        run: |
          git config user.name  "menu-tv-bot"
          git config user.email "bot@users.noreply.github.com"
          git add state/
          git diff --staged --quiet || git commit -m "menu du $(date -u +%F)"
          git push
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  publier:
    needs: construire
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - id: deploiement
        uses: actions/deploy-pages@v4
