name: Menu TV quotidien

on:
  schedule:
    # TROIS horaires, pas un. GitHub met les taches planifiees dans une file
    # commune : une execution retardee est courante, et une execution manquee
    # DISPARAIT sans jamais etre rattrapee. Un seul cron, c'est un pari.
    #
    # Le job est idempotent - le relancer ne fait que regenerer la page - donc
    # la redondance ne coute rien : si le premier tir passe, les suivants ne
    # font que rafraichir avec les videos parues entre-temps.
    #
    # Heures UTC, decalees de l'heure pile (la minute 0 est celle que tout le
    # monde choisit, donc la plus encombree).
    - cron: "17 6 * * *"    # 08h17 Paris en ete
    - cron: "43 8 * * *"    # 10h43
    - cron: "9 11 * * *"    # 13h09
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: menu-tv
  cancel-in-progress: false

jobs:
  construire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests pyyaml
      - name: Generer la grille
        env:
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
        run: python menu_tv.py
      - name: Memoriser ce qui a ete propose
        run: |
          git config user.name  "menu-tv-bot"
          git config user.email "bot@users.noreply.github.com"
          git add state/
          git diff --staged --quiet || git commit -m "menu du $(date -u +%F)"
          git push
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  publier:
    needs: construire
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - id: deploiement
        uses: actions/deploy-pages@v4
