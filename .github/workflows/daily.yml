name: Menu TV quotidien

on:
  schedule:
    # 06h17 UTC = 08h17 Paris en ete, 07h17 en hiver.
    # Pas a l'heure pile : GitHub met les taches planifiees dans une file
    # commune, et la minute 0 est celle que tout le monde choisit. Aux heures
    # de pointe les runs y sont retardes, parfois abandonnes.
    - cron: "17 6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: menu-tv
  cancel-in-progress: false

jobs:
  construire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests pyyaml
      - name: Generer la grille
        env:
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
        run: python menu_tv.py
      - name: Memoriser ce qui a ete propose
        run: |
          git config user.name  "menu-tv-bot"
          git config user.email "bot@users.noreply.github.com"
          git add state/
          git diff --staged --quiet || git commit -m "menu du $(date -u +%F)"
          git push
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  publier:
    needs: construire
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - id: deploiement
        uses: actions/deploy-pages@v4
