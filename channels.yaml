# =============================================================================
# Liste de départ des chaînes de référence.
#
# C'est le SEUL fichier à maintenir à la main. Tout le reste en découle.
#
# - handle    : le @identifiant YouTube (visible sur l'URL de la chaîne)
# - intention : apprendre | monde | emerveiller | culture | faire | detente
# - langue    : fr | en
#
# Les handles sont résolus une fois en channel_id et mis en cache dans
# state/channels.json. Ceux qui échouent sont signalés dans le rapport de run :
# corrige-les ici, ne touche pas au cache.
#
# Cette liste est un point de départ à corriger — elle reflète mes suppositions,
# pas tes goûts. Ajoute, supprime, reclasse librement.
# =============================================================================

