# =============================================================================
# Les chaînes de référence. Le seul fichier éditorial.
#
#   handle    : le @identifiant YouTube (visible dans l'URL de la chaîne)
#   intention : voir la liste ci-dessous
#   langue    : fr | en
#
# LES ONZE INTENTIONS, ET LE TEST QUI TRANCHE
# Une seule question : qu'est-ce qu'il te reste après ?
#
#   actualites  ce qui vient de se passer  daté, périssable — fenêtre de 2 jours
#   comprendre  un mécanisme      « ça marche comment ? » — intemporel
#   monde       une situation     « pourquoi c'est comme ça ? » — daté, situé
#   oeuvres     une rencontre     ça parle d'une œuvre, d'un auteur, d'un courant
#   recit       une histoire      il y a un début, un milieu, une fin
#   faire       un savoir-faire   un geste que tu pourrais reproduire
#   regarder    une image         la valeur est dans ce qu'on voit, pas ce qu'on apprend
#   ecouter     une conversation  quelqu'un déroule une pensée en temps réel
#   jouer       une partie        jeu vidéo, jeu de société, compétition
#   bouger      un corps          sport, performance physique
#   rire        un moment léger   l'objectif déclaré est de faire rire
#
# En cas d'hésitation entre deux, demande-toi ce que tu raconterais à quelqu'un
# le lendemain. Si c'est « j'ai appris que », c'est comprendre ou monde. Si c'est
# « il y a une histoire de », c'est recit. Si c'est « tu devrais voir ça »,
# c'est regarder.
#
# ATTENTION : cette liste est une PROPOSITION, pas une recommandation validée.
# Les handles sortent de ma mémoire. Ceux qui échouent sont signalés au premier
# run, avec un repli par recherche dont les résultats sont à vérifier.
# =============================================================================

chaines:

